
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find an order | Order Processing</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
</head>
<body class="bg-light">
    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold text-dark" href="/">Order Processing</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <p class="text-primary fw-semibold text-uppercase small mb-2">Order lookup</p>
                        <h1 class="h2 fw-bold mb-2">Find your order</h1>
                        <p class="text-secondary mb-4">
                            Enter your order reference to view the latest order details.
                        </p>

                        <form action="/orders/search" method="GET">
                            <label for="reference" class="form-label fw-medium">Order reference</label>
                            <div class="input-group input-group-lg">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="reference"
                                    name="reference"
                                    placeholder="e.g. ORD-1001"
                                    aria-describedby="reference-help"
                                    required
                                >
                                <button class="btn btn-primary px-4" type="submit">Search</button>
                            </div>
                            <div id="reference-help" class="form-text mt-2">
                                You can find this reference in your order confirmation.
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-center text-secondary small mt-4 mb-0">
                    Need help? Have your order reference ready when you contact support.
                </p>
            </div>
        </div>
    </main>
</body>
</html>
